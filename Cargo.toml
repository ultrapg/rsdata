[package]
name = "rsdata"
version = "0.2.0"
edition = "2024"

[dependencies]
walkdir = "2"
clap = { version = "4", features = ["derive", "color"] }
regex = "1"
ignore = "0.4"
globset = "0.4"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"
colored = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation"] }
